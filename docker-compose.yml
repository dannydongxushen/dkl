services:
  clinic-pilot:
    build: .
    container_name: clinic-pilot-ai
    ports:
      - "8088:8088"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - HF_ENDPOINT=https://hf-mirror.com
      - PYTHONUNBUFFERED=1
    dns:
      - 8.8.8.8
      - 114.114.114.114
    restart: unless-stopped