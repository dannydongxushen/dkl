<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicPilot AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="chat-panel">
            <div class="panel-header">
                <h2>ClinicPilot AI</h2>
                <span class="badge">Agent Active</span>
            </div>
            <div id="chat-box"></div>
            <div class="input-area">
                <input type="text" id="message-input" placeholder="Type your message here..." autocomplete="off">
                <button id="send-btn">Send</button>
            </div>
        </div>
        
        <div class="bookings-panel">
            <div class="patient-card">
                <div class="patient-info">
                    <div class="avatar">JD</div>
                    <div>
                        <h3>John Doe <span class="patient-id">(P001)</span></h3>
                        <p class="allergy-warning">⚠️ Allergies: Penicillin, Peanuts</p>
                    </div>
                </div>
                <div class="time-display">
                    <span class="time-label">Current Time</span>
                    <span id="current-datetime">Loading...</span>
                </div>
            </div>

            <div class="bookings-header">
                <h2>My Bookings</h2>
                <button id="refresh-btn">Refresh Data</button>
            </div>
            
            <div class="table-container">
                <table id="bookings-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Doctor</th>
                            <th>Treatment</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="bookings-body">
                        <!-- Data will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
